name: Limpieza de cachés de Actions

# BL-282 (Anexo 12, G16). GitHub da 10 GB de caché por repositorio. Al
# pasarlos, desaloja entradas sin avisar: las corridas vuelven a descargar
# la base de Trivy (~1,3 GB) y las dependencias de npm, más lentas y con
# más riesgo de fallas de red. El 08/10/2026 la caché llegó a 9,69 GB.
#
# Cuándo corre:
#   - Al cerrarse un PR (mergeado o no): borra las cachés de ese PR
#     (ref refs/pull/<n>/merge), que ya no se van a volver a usar.
#   - Diario: 07:47 UTC (04:47 en Uruguay). Tiene que ser diario porque la
#     base de Trivy genera una clave nueva de ~1 GB por día: con una
#     limpieza semanal se juntarían hasta 7 GB entre corrida y corrida.
#     Minuto 47 para no caer en la hora en punto, cuando GitHub demora o
#     saltea crons. Solo corre desde la rama por defecto. Borra de verdad.
#   - Manual: Actions → "Run workflow", por defecto en dry-run.
#
# Política de la corrida diaria y manual:
#   1. Base de Trivy (claves cache-trivy-AAAA-MM-DD, una por día y de hasta
#      ~1 GB): se conservan la de hoy y la de ayer (UTC); se borran las
#      anteriores. Es lo que más ocupa.
#   2. Cachés de PRs ya cerrados (por si alguna se escapó del disparador
#      de cierre, por ejemplo las anteriores a este workflow).
#   3. Cachés de ramas que ya no existen (se borran al mergear, G6).
#   Las cachés de develop y main y el resto de las claves (npm, binario de
#   Trivy, CodeQL) no se tocan: las que no se usan en 7 días las borra
#   GitHub solo.
#
# Por qué "gh" directo y no una action de terceros: queda legible y
# versionado acá, y no le pasa el token a código ajeno (G12).

on:
  pull_request:
    types: [closed]
  schedule:
    - cron: "47 7 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no borra nada, solo lista qué borraría)"
        required: false
        type: choice
        options:
          - "true"
          - "false"
        default: "true"

permissions:
  actions: write # listar y borrar cachés
  contents: read # consultar si una rama existe
  pull-requests: read # consultar si un PR está cerrado

concurrency:
  group: limpiar-caches
  cancel-in-progress: false

jobs:
  caches-del-pr:
    name: 🧹 Cachés del PR cerrado
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Borrar las cachés del PR #${{ github.event.pull_request.number }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF: refs/pull/${{ github.event.pull_request.number }}/merge
        run: |
          set -euo pipefail
          ids=$(gh cache list --ref "$REF" --limit 1000 --json id --jq '.[].id')
          if [ -z "$ids" ]; then
            echo "El PR no tenía cachés."
            exit 0
          fi
          n=0
          for id in $ids; do
            gh cache delete "$id"
            n=$((n + 1))
          done
          echo "Borradas $n cachés de $REF." | tee -a "$GITHUB_STEP_SUMMARY"

  limpieza-periodica:
    name: 🧹 Limpieza periódica de cachés
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Limpiar cachés viejas
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # En el cron no hay inputs: borra de verdad. Manual: lo que se
          # elija en el input (por defecto dry-run).
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
        run: |
          set -euo pipefail

          gh cache list --limit 1000 --json id,key,ref,sizeInBytes > caches.json
          total=$(jq length caches.json)
          bytes_antes=$(jq '[.[].sizeInBytes] | add // 0' caches.json)

          hoy=$(date -u +%F)
          ayer=$(date -u -d 'yesterday' +%F)

          # Marca cada caché con el motivo para borrarla (vacío = se conserva).
          : > borrar.tsv
          declare -A rama_existe pr_cerrado

          while IFS=$'\t' read -r id key ref size; do
            motivo=""

            # 1. Base de Trivy de días anteriores a ayer.
            if [[ "$key" =~ ^cache-trivy-([0-9]{4}-[0-9]{2}-[0-9]{2})$ ]]; then
              fecha="${BASH_REMATCH[1]}"
              if [[ "$fecha" < "$ayer" ]]; then
                motivo="base de Trivy del $fecha"
              fi
            fi

            # 2. PR cerrado.
            if [ -z "$motivo" ] && [[ "$ref" =~ ^refs/pull/([0-9]+)/merge$ ]]; then
              pr="${BASH_REMATCH[1]}"
              if [ -z "${pr_cerrado[$pr]:-}" ]; then
                estado=$(gh pr view "$pr" --json state --jq .state 2>/dev/null || echo "DESCONOCIDO")
                pr_cerrado[$pr]=$([ "$estado" = "OPEN" ] && echo no || echo si)
              fi
              if [ "${pr_cerrado[$pr]}" = "si" ]; then
                motivo="PR #$pr cerrado"
              fi
            fi

            # 3. Rama que ya no existe (nunca develop ni main).
            if [ -z "$motivo" ] && [[ "$ref" =~ ^refs/heads/(.+)$ ]]; then
              rama="${BASH_REMATCH[1]}"
              if [ "$rama" != "develop" ] && [ "$rama" != "main" ]; then
                if [ -z "${rama_existe[$rama]:-}" ]; then
                  if gh api "repos/$GH_REPO/branches/$(jq -rn --arg r "$rama" '$r|@uri')" --silent 2>/dev/null; then
                    rama_existe[$rama]=si
                  else
                    rama_existe[$rama]=no
                  fi
                fi
                if [ "${rama_existe[$rama]}" = "no" ]; then
                  motivo="rama $rama borrada"
                fi
              fi
            fi

            if [ -n "$motivo" ]; then
              printf '%s\t%s\t%s\t%s\n' "$id" "$size" "$key" "$motivo" >> borrar.tsv
            fi
          done < <(jq -r '.[] | [.id, .key, .ref, .sizeInBytes] | @tsv' caches.json)

          a_borrar=$(wc -l < borrar.tsv)
          bytes_borrar=$(awk -F'\t' '{s += $2} END {print s + 0}' borrar.tsv)
          mb() { awk -v b="$1" 'BEGIN {printf "%.0f MB", b / 1048576}'; }

          {
            echo "## 🧹 Limpieza de cachés de Actions"
            echo ""
            if [ "$DRY_RUN" = "true" ]; then
              echo "**Dry run:** no se borró nada; esto es lo que se borraría."
              echo ""
            fi
            echo "| | Cachés | Tamaño |"
            echo "|---|---|---|"
            echo "| Antes | $total | $(mb "$bytes_antes") |"
            echo "| A borrar | $a_borrar | $(mb "$bytes_borrar") |"
            echo "| Después | $((total - a_borrar)) | $(mb $((bytes_antes - bytes_borrar))) |"
            echo ""
            if [ "$a_borrar" -gt 0 ]; then
              echo "| Clave | Tamaño | Motivo |"
              echo "|---|---|---|"
              while IFS=$'\t' read -r id size key motivo; do
                echo "| \`$key\` | $(mb "$size") | $motivo |"
              done < borrar.tsv
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: se borrarían $a_borrar de $total cachés ($(mb "$bytes_borrar"))."
            exit 0
          fi

          while IFS=$'\t' read -r id size key motivo; do
            gh cache delete "$id"
            echo "Borrada: $key ($motivo)"
          done < borrar.tsv
          echo "Borradas $a_borrar de $total cachés ($(mb "$bytes_borrar"))."
