name: Actualizar Dashboard de Bugs (GitHub Issues)

on:
  workflow_dispatch: {} # botón manual "Run workflow" en la pestaña Actions
  schedule:
    # Mismas fechas de cierre de sprint que el dashboard de avance (ver nota
    # de fechas pendientes de actualizar en update-dashboard.yml).
    - cron: "0 18 14 8 *" # Cierre Sprint 1 - 14/08
    - cron: "0 18 28 8 *" # Cierre Sprint 2 - 28/08
    - cron: "0 18 11 9 *" # Cierre Sprint 3 - 11/09
    - cron: "0 18 25 9 *" # Cierre Sprint 4 - 25/09
    - cron: "0 18 9 10 *" # Cierre Sprint 5 - 09/10
    - cron: "0 18 23 10 *" # Cierre Sprint 6 - 23/10
    - cron: "0 18 6 11 *" # Cierre Sprint 7 - 06/11
    - cron: "0 18 20 11 *" # Cierre Sprint 8 - 20/11
    - cron: "0 18 4 12 *" # Cierre Sprint 9 - 04/12
    - cron: "0 18 10 12 *" # Entrega final - 10/12
  issues:
    types: [opened, closed, reopened, labeled, unlabeled]

jobs:
  update-bugs-dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.DASHBOARD_PUSH_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Actualizar dashboard de bugs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-github-bugs-dashboard.mjs

      - name: Commit y push si hubo cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/dashboard-bugs-github.md
          git diff --quiet --cached || git commit -m "chore: actualizar dashboard de bugs [skip ci]"
          git push
