name: Actualizar Dashboard EDT desde Linear

on:
  workflow_dispatch: {} # botón manual "Run workflow" en la pestaña Actions
  schedule:
    # Basado en las fechas de cierre de sprint del plan ORIGINAL (Anexo 7).
    # ⚠️ Pendiente: actualizar estas fechas cuando se confirme el cronograma
    # real (Sprints 1-3 se corrieron, Sprints 4-9 se comprimieron según el
    # Gantt actualizado).
    - cron: "0 18 14 8 *" # Cierre Sprint 1 - 14/08
    - cron: "0 18 28 8 *" # Cierre Sprint 2 - 28/08
    - cron: "0 18 11 9 *" # Cierre Sprint 3 - 11/09
    - cron: "0 18 25 9 *" # Cierre Sprint 4 - 25/09
    - cron: "0 18 9 10 *" # Cierre Sprint 5 - 09/10
    - cron: "0 18 23 10 *" # Cierre Sprint 6 - 23/10
    - cron: "0 18 6 11 *" # Cierre Sprint 7 - 06/11
    - cron: "0 18 20 11 *" # Cierre Sprint 8 - 20/11
    - cron: "0 18 4 12 *" # Cierre Sprint 9 - 04/12
    - cron: "0 18 10 12 *" # Entrega final - 10/12

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.DASHBOARD_PUSH_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Actualizar dashboard desde Linear
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_TEAM_KEY: ${{ vars.LINEAR_TEAM_KEY }}
        run: node scripts/update-dashboard-from-linear.mjs

      - name: Commit y push si hubo cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/dashboard-avance-edt.md
          git diff --quiet --cached || git commit -m "chore: actualizar dashboard EDT desde Linear [skip ci]"
          git push
