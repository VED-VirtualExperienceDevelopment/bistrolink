# ============================================================================
# .github/workflows/performance.yml
#
# Workflow aparte del ci.yml principal — job manual de Performance
# (k6 + Lighthouse + Playwright) con reporte a Kiwi TCMS.
#
# Por qué separado: no se dispara nunca en push ni pull_request, así que no
# tiene sentido que viva dentro de ci.yml (que sí corre en cada push/PR) ni
# que dependa de sus jobs. Al ser standalone, duplica localmente el cálculo
# del "version label" (mismo criterio que el job "version" de ci.yml) en vez
# de depender de un job de otro workflow.
#
# Requisitos:
#   - Los secrets KIWI_TCMS_URL / KIWI_TCMS_USERNAME / KIWI_TCMS_PASSWORD ya
#     existen en el repo (los usa ci.yml) — no hace falta crear nada nuevo.
#   - BL-607: TC-P-004 (Playwright) usa TEST_ADMIN_USERNAME y
#     TEST_ADMIN_PASSWORD, los mismos secrets del job de E2E de ci.yml.
#   - Asume que staging ya está desplegado (no lo deploya ni lo redeploya):
#     corre k6 contra bistrolink-api-staging y Lighthouse contra
#     bistrolink-web-staging, igual que hace ci.yml.
#
# Cómo correrlo: pestaña Actions → "Performance (k6 + Lighthouse)" →
# "Run workflow".
# ============================================================================

name: Performance (k6 + Lighthouse)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Motivo de esta corrida manual"
        required: false
        default: "corrida manual de performance"

permissions:
  contents: read

jobs:
  # ── VERSION LABEL ───────────────────────────────────────────────────────
  # Mismo criterio que el job "version" de ci.yml (fecha del commit + SHA
  # corto), duplicado acá porque este workflow no puede depender de un job
  # de otro workflow. Solo se usa para armar un TCMS_BUILD legible.
  version:
    name: 🏷️ Version label
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.build_label.outputs.value }}
    steps:
      - uses: actions/checkout@v7

      - name: Set build label
        id: build_label
        run: echo "value=$(git log -1 --date=format:'%Y-%m-%d_%H-%M' --format='%cd')-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

  # ── PERFORMANCE (k6 + Lighthouse) → Kiwi TCMS ───────────────────────────
  # k6 y Lighthouse no generan JUnit XML nativo (a diferencia de Jest/
  # Playwright), así que cada corrida se traduce a mano a un junit.xml
  # mínimo (un <testcase> por umbral/assert) antes de subir a Kiwi con el
  # mismo plugin y patrón que usan los jobs "jest" y "playwright-report" de
  # ci.yml.
  #
  # Los nombres de <testcase> son EXACTAMENTE el Summary de cada TC-P-XXX en
  # Kiwi (TC-1527/1528/1529). El plugin arma el Summary para buscar/crear el
  # Test Case con un template FIJO e incondicional: "${classname}.${name}"
  # (ver DEFAULT_TEMPLATE en tcms_junit_plugin/__init__.py) — no hay ningún
  # chequeo de "si hay classname, agregalo": el punto separador siempre se
  # inserta, pase lo que pase en "classname" (con valor, vacío u omitido).
  # Nos costó 3 corridas duplicadas encontrar esto: "classname.name",
  # "None.name" (classname omitido) y ".name" (classname="") — ninguna
  # matcheaba el Summary real. El fix real es el flag
  # "--summary-template '${name}'" al invocar el plugin (ver el step de
  # abajo), que ignora "classname" por completo y usa el "name" tal cual,
  # que sí matchea los casos ya cargados a mano.
  #
  # TCMS_PLAN_ID fija el Test Run dentro del Test Plan ya creado a mano
  # (TP-7: Performance-k6-Lighthouse) en vez de dejar que el plugin arme su
  # plan automático "[junit.xml] Plan for Bistrolink (develop)".
  #
  # NOTA: la forma exacta del JSON de "k6 run --summary-export" y del
  # manifest.json de lhci se documenta abajo tal como las publican k6 y
  # @lhci/cli hoy — conviene revisar a mano el primer run real antes de
  # confiar ciegamente en lo que queda reportado en Kiwi.
  performance:
    name: ⚡ Performance (k6 + Lighthouse) → Kiwi TCMS
    needs: [version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          # Fuerza la última 22.x publicada: la caché del runner puede ir atrasada
          # y quedarse con una versión sin los parches de seguridad.
          check-latest: true
          # BL-607: TC-P-004 necesita las dependencias del repo (Playwright).
          cache: npm

      # Se corre a mano, muchas veces con staging dormido (serverless de
      # Railway). Sin esto, los primeros pedidos de k6 y de Lighthouse miden
      # el arranque de los servicios y no la app.
      - name: Despertar staging
        uses: ./.github/actions/despertar-staging

      # ── k6 ──────────────────────────────────────────────────────────────
      - name: Instalar k6
        uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2

      # BL-607: el resultado de cada caso sale del código de salida de k6
      # (0 = umbrales cumplidos, 99 = algún umbral no se cumplió, otro =
      # error de la corrida), que no cambia entre versiones de k6. El JSON de
      # --summary-export queda solo como detalle: en ese formato, «true» en
      # un umbral significa que NO se cumplió.
      - name: k6 — TC-P-001 (load-test.js)
        env:
          BASE_URL: https://bistrolink-api-staging.up.railway.app
        run: |
          set +e
          k6 run --summary-export=k6-load-test-summary.json k6/load-test.js
          echo $? > k6-load-test.exit

      - name: k6 — TC-P-002 (pedidos-carga.js)
        env:
          BASE_URL: https://bistrolink-api-staging.up.railway.app
        run: |
          set +e
          k6 run --summary-export=k6-pedidos-carga-summary.json k6/pedidos-carga.js
          echo $? > k6-pedidos-carga.exit

      # ── Lighthouse ──────────────────────────────────────────────────────
      - name: Lighthouse CI — TC-P-003 (menú digital, HU-001)
        continue-on-error: true
        run: npx @lhci/cli@0.14.x autorun

      # ── Playwright (BL-607) ─────────────────────────────────────────────
      # TC-P-004: el editor del mapa de mesas con 20 mesas a ≥ 30 FPS
      # (HU-016, RD.05). Es el spec e2e/performance/mapa-mesas-fps.spec.ts,
      # en el proyecto «performance» de playwright.config.ts. Crea sus 20
      # mesas en staging y las borra al terminar.
      - name: Instalar dependencias (Playwright)
        env:
          # El postinstall del backend corre «prisma generate», que exige
          # DATABASE_URL aunque no se conecte (mismo valor de prueba que
          # ci.yml).
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
        run: npm ci

      - name: Instalar Chromium de Playwright
        run: npx playwright install --with-deps chromium

      - name: Playwright — TC-P-004 (mapa de mesas, HU-016)
        continue-on-error: true
        env:
          BASE_URL: https://bistrolink-web-staging.up.railway.app
          API_URL: https://bistrolink-api-staging.up.railway.app
          TEST_ADMIN_USERNAME: ${{ secrets.TEST_ADMIN_USERNAME }}
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
        run: npx playwright test --project=performance

      # ── Traducción a JUnit XML ────────────────────────────────────────────
      # Un threshold/assert que dio false = <failure> en ese <testcase> (no
      # hace fallar el job: lo que interesa es reportar a Kiwi el resultado
      # real, pase o no pase).
      - name: Traducir resultados a JUnit XML
        if: always()
        run: |
          python3 - <<'PY'
          import json, glob
          import xml.etree.ElementTree as ET

          testsuites = ET.Element("testsuites")
          suite = ET.SubElement(testsuites, "testsuite", name="performance")

          def add_case(name, classname, passed, detail=""):
              case = ET.SubElement(suite, "testcase", classname="", name=name, time="0")
              if not passed:
                  failure = ET.SubElement(case, "failure", message="umbral no cumplido")
                  failure.text = detail

          # BL-607: pasa solo si k6 terminó con código 0. Antes se leía el
          # JSON con «all(thresholds.values())», pero ahí «true» significa
          # umbral NO cumplido: el caso daba al revés.
          def resultado_k6(base):
              try:
                  codigo = int(open(f"{base}.exit").read().strip())
              except (FileNotFoundError, ValueError):
                  return False, "k6 no llegó a correr"
              umbrales = []
              try:
                  with open(f"{base}-summary.json") as f:
                      data = json.load(f)
                  for nombre, metrica in data.get("metrics", {}).items():
                      for umbral, fallo in (metrica.get("thresholds") or {}).items():
                          umbrales.append(f"{nombre} {umbral}: {'no cumplido' if fallo else 'cumplido'}")
              except (FileNotFoundError, ValueError):
                  umbrales.append(f"sin {base}-summary.json")
              if codigo == 0:
                  return True, "; ".join(umbrales)
              motivo = "umbral no cumplido" if codigo == 99 else f"k6 terminó con código {codigo}"
              return False, "; ".join([motivo] + umbrales)

          # TC-P-001 — p95 < 1,5 s y menos de 1 % de errores con 20 sesiones
          # (BL-607: 20, como la Línea de Base; antes eran 70). El título
          # cambió: el caso de Kiwi se renombra con
          # scripts/kiwi/cargar-casos-integracion.mjs --performance antes de
          # la primera corrida, para que el plugin no cree uno nuevo.
          passed, detail = resultado_k6("k6-load-test")
          add_case(
              "[TC-P-001] HU-001: performance de /api/menu bajo carga (20 sesiones simultáneas, p95 menor a 1.5s)",
              "k6.load-test", passed, detail,
          )

          # TC-P-002 — sin errores y p95 de POST /pedidos < 500 ms con 20 comensales
          passed, detail = resultado_k6("k6-pedidos-carga")
          add_case(
              "[TC-P-002] HU-003: 20 comensales confirman pedido en simultáneo sin errores 5xx y p95 menor a 500 ms",
              "k6.pedidos-carga", passed, detail,
          )

          # TC-P-003 — score de Lighthouse (categories:performance >= 0.8),
          # leído del manifest.json que deja lhci en el outputDir configurado
          # en lighthouserc.json (o en ./.lighthouseci/ si upload.target no
          # fuera "filesystem").
          manifests = glob.glob("lighthouse-results/manifest.json") or glob.glob(".lighthouseci/manifest.json")
          passed = False
          detail = "no se encontró manifest.json de lhci"
          if manifests:
              with open(manifests[0]) as f:
                  manifest = json.load(f)
              rep = next((r for r in manifest if r.get("isRepresentativeRun")), manifest[-1] if manifest else None)
              if rep:
                  score = rep.get("summary", {}).get("performance")
                  passed = score is not None and score >= 0.8
                  detail = f"score={score}"
          add_case(
              # Mismo título que scripts/kiwi/lighthouse-a-junit.mjs (BL-437).
              "[TC-P-003] HU-001: performance Lighthouse del menú digital en celular (score ≥ 0.8)",
              "lighthouse", passed, detail,
          )

          # TC-P-004 — editor del mapa de mesas con 20 mesas a ≥ 30 FPS
          # (BL-607), leído del JUnit de Playwright. Pasa si el test no falló
          # ni se salteó; el detalle lleva los FPS medidos (anotación «fps»
          # del test) o el motivo del fallo.
          passed = False
          detail = "no se encontró playwright-report/junit.xml"
          try:
              junit = ET.parse("playwright-report/junit.xml")
              caso = next(
                  (c for c in junit.iter("testcase") if "TC-P-004" in (c.get("name") or "")),
                  None,
              )
              if caso is None:
                  detail = "TC-P-004 no está en el JUnit de Playwright"
              else:
                  fallo = caso.find("failure")
                  if fallo is None:
                      fallo = caso.find("error")
                  salteado = caso.find("skipped") is not None
                  fps = next(
                      (p.get("value") for p in caso.iter("property") if p.get("name") == "fps"),
                      None,
                  )
                  passed = fallo is None and not salteado
                  if salteado:
                      detail = "el test se salteó"
                  elif fallo is not None:
                      detail = (fallo.get("message") or fallo.text or "falló")[:500]
                  else:
                      detail = fps or "aprobado"
          except (FileNotFoundError, ET.ParseError) as error:
              detail = f"no se pudo leer el JUnit de Playwright: {error}"
          add_case(
              "[TC-P-004] HU-016: el editor del mapa de mesas mantiene al menos 30 FPS al arrastrar una mesa con 20 mesas en el plano",
              "playwright", passed, detail,
          )

          ET.ElementTree(testsuites).write("performance-junit.xml", encoding="utf-8", xml_declaration=True)
          PY

      # BL-601: resumen de la corrida en el Summary (informativo).
      - name: Resumen de las pruebas (Summary)
        if: always()
        continue-on-error: true
        run: |
          node scripts/dashboards/resumen-pruebas.mjs \
            --titulo "⚡ Performance (k6 + Lighthouse)" \
            --artifact performance-results \
            --kiwi "TP-7" \
            "Performance=performance-junit.xml"

      - name: Upload resultados de performance (artifact)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: performance-results
          path: |
            performance-junit.xml
            k6-*-summary.json
            k6-*.exit
            lighthouse-results/
          retention-days: 14

      # Mismo plugin y patrón que "jest"/"playwright-report" en ci.yml.
      # TCMS_BUILD lleva sufijo "-performance" para que quede en su propio
      # TestRun, separado de -backend/-frontend/-e2e. TCMS_PLAN_ID fija el
      # Test Plan (TP-7) para no crear uno automático nuevo en cada corrida.
      #
      # --summary-template '${name}': el plugin arma el Summary con un
      # template FIJO e incondicional, "${classname}.${name}" (ver
      # tcms_junit_plugin/__init__.py, DEFAULT_TEMPLATE) — sin ningún chequeo
      # de "si hay classname". Probamos con classname="k6.load-test"
      # ("k6.load-test.<name>"), sin el atributo ("None.<name>") y con
      # classname="" (".<name>", el punto solo) — ninguno matcheaba el
      # Summary real de TC-1527/1528/1529 y cada corrida creaba un Test Case
      # nuevo. Pasando este flag el Summary usado para buscar/crear es
      # exactamente "${name}", igual al texto ya cargado a mano, sin prefijo
      # ni punto de ningún tipo.
      - name: Upload results to Kiwi TCMS (performance)
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        env:
          TCMS_PRODUCT: "Bistrolink"
          TCMS_PRODUCT_VERSION: ${{ github.ref_name }}
          TCMS_BUILD: ${{ needs.version.outputs.label }}-performance
          TCMS_PLAN_ID: "7"
        run: |
          pip install kiwitcms-junit.xml-plugin --break-system-packages
          cat <<EOF > ~/.tcms.conf
          [tcms]
          url = ${{ secrets.KIWI_TCMS_URL }}/xml-rpc/
          username = ${{ secrets.KIWI_TCMS_USERNAME }}
          password = ${{ secrets.KIWI_TCMS_PASSWORD }}
          EOF
          tcms-junit.xml-plugin --verbose --summary-template '${name}' performance-junit.xml
