codecov:
  require_ci_to_pass: true
  notify:
    wait_for_ci: true

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: false
    patch:
      default:
        target: 80%
        threshold: 0%
        informational: false

flags:
  backend:
    paths:
      - apps/backend/
    carryforward: false

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: false

ignore:
  - "apps/backend/src/main.ts"
  - "apps/backend/src/app.module.ts"
  - "apps/backend/src/**/*.module.ts"
  - "apps/backend/src/**/*.controller.ts"
  - "!apps/backend/src/health.controller.ts"
  - "apps/backend/src/**/dto/**"
  - "apps/backend/test/**"
  - "apps/backend/**/*.spec.ts"
  - "apps/backend/**/*.e2e-spec.ts"
  - "apps/backend/prisma/migrations/**"
  - "apps/backend/dist/**"
  - "apps/frontend/**"
