name: CI/CD BistroLink

on:
  push:
    branches: [develop, main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      reason:
        description: "Motivo del deploy manual"
        required: false
        default: "deploy manual"

permissions:
  contents: read
  security-events: write
  packages: write

env:
  IMAGE_API: ghcr.io/ved-virtualexperiencedevelopment/bistrolink-api
  IMAGE_WEB: ghcr.io/ved-virtualexperiencedevelopment/bistrolink-web
  IMAGE_AUTH: ghcr.io/ved-virtualexperiencedevelopment/bistrolink-auth
  TAG: ${{ github.sha }}
  # prisma.config.ts usa env() de 'prisma/config', que desde Prisma 6 valida
  # de forma estricta que DATABASE_URL exista — incluso en "prisma generate",
  # que no necesita conexión real. Se define acá (nivel workflow) para que
  # TODOS los jobs que corren npm install/ci (postinstall dispara ese
  # generate) lo tengan disponible, no solo el job "jest".
  DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

jobs:
  # ── JOB 0: DETECTAR CAMBIOS ────────────────────────────────────────────────
  # Reemplaza la detección vía github.event.head_commit.modified/added: ese
  # campo se calcula comparando el commit contra su padre inmediato, y con
  # "Squash and merge" hecho desde la UI de GitHub, ese cálculo viene vacío o
  # incompleto de forma no confiable (limitación documentada del payload del
  # evento push, no un bug de este workflow). dorny/paths-filter en cambio
  # hace un git diff explícito contra el commit anterior al push
  # (github.event.before), así que detecta los cambios reales sin importar
  # si el commit vino de un push directo, un merge commit o un squash.
  changes:
    name: 🔎 Detectar cambios (paths-filter)
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.filter.outputs.apps }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            apps:
              - 'apps/**'
              - 'packages/**'

  # ── JOB 1: LINT ───────────────────────────────────────────────────────────
  lint:
    name: 🔍 Lint (ESLint + Prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          # cache: npm

      - name: Instalar dependencias
        run: npm install

      - name: Lint
        run: npm run lint

  # ── JOB 2: TESTS UNITARIOS (Jest) ─────────────────────────────────────────
  jest:
    name: 🧪 Tests unitarios (Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependencias
        run: npm ci
        env:
          # prisma generate corre solo (postinstall) y necesita que la variable
          # exista, aunque no se conecte a ninguna base real durante "generate".
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

      - name: Tests Jest (cobertura mínima 80%)
        run: npm run test:cov --workspace=backend
        env:
          CI: true
          # keycloak-admin.service.spec.ts instancia KeycloakAdminService sin
          # mockear nada y sí ejercita getAdminToken() (con fetch mockeado) —
          # necesita que el getter clientSecret encuentre algo, aunque sea
          # dummy, para no lanzar. No se conecta a un Keycloak real en CI.
          KEYCLOAK_URL: "http://localhost:8080"
          KEYCLOAK_REALM: "bistrolink"
          KEYCLOAK_CLIENT_ID: "bistrolink-backend-test"
          KEYCLOAK_CLIENT_SECRET: "dummy-secret-for-ci"

      - name: Upload results to Testiny
        if: always()
        continue-on-error: true
        env:
          TESTINY_API_KEY: ${{ secrets.TESTINY_API_KEY }}
        run: npx -y @testiny/cli automation --project "BLVED" --source "backend-unit-tests" --junit apps/backend/coverage/junit.xml

  # NOTA: este job corre solo los tests UNITARIOS (npm run test:cov), no el
  # test:e2e de aislamiento multi-tenant (tenant-isolation.e2e-spec.ts) — ese
  # necesita Keycloak + Postgres reales con el realm importado y 3 fixtures
  # de usuario ya creados (Cocina, sin-tenant, tenant B), y todavía no tiene
  # su propio job de CI con service containers + script de seed. Queda
  # pendiente como paquete aparte (correspondería a EDT 1.8.6, corrido en CI).

  # ── JOB 3: TESTS DE CONTRATO (PactJS) ────────────────────────────────────
  # pact:
  #   name: 🤝 Tests de contrato (PactJS)
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v7

  #     - uses: actions/setup-node@v7
  #       with:
  #         node-version: "20"
  #         cache: npm

  #     - name: Instalar dependencias
  #       run: npm ci

  #     - name: Tests de contrato PactJS
  #       run: npm run test:pact

  # ── JOB 4: GITLEAKS ───────────────────────────────────────────────────────
  gitleaks:
    name: 🔐 Secretos (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Escaneo de secretos con Gitleaks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        run: |
          set -euo pipefail
          # v8.12.0 -> v8.30.1: última versión estable (Gitleaks quedó feature-complete,
          # solo recibe parches de seguridad; conviene revisar este número cada tanto).
          VERSION=8.30.1
          TMPDIR=$(mktemp -d)
          curl -sSL -o "${TMPDIR}/gitleaks.tar.gz" \
            "https://github.com/zricethezav/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          mkdir -p "${TMPDIR}/bin"
          tar -xzf "${TMPDIR}/gitleaks.tar.gz" -C "${TMPDIR}/bin"
          "${TMPDIR}/bin/gitleaks" detect \
            --redact -v \
            --exit-code=2 \
            --report-format=sarif \
            --report-path=gitleaks-results \
            --log-level=debug \
            --log-opts="--no-merges"

      - name: Subir reporte Gitleaks al Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gitleaks-results
          category: "gitleaks"

  # ── JOB 5: CODEQL ─────────────────────────────────────────────────────────
  codeql:
    name: 🛡️ SAST (CodeQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: CodeQL — init
        uses: github/codeql-action/init@v4
        with:
          languages: javascript

      - name: CodeQL — análisis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript"
          upload: always

  # ── JOB 6: SONARCLOUD ─────────────────────────────────────────────────────
  sonarcloud:
    name: 📊 SAST (SonarCloud)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: SonarCloud
        uses: SonarSource/sonarcloud-github-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ── JOB 7: SNYK ───────────────────────────────────────────────────────────
  snyk:
    name: 📦 Dependencias (Snyk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          # cache: npm

      - name: Instalar dependencias
        run: npm install

      - name: Auditoría Snyk
        uses: snyk/actions/node@0.4.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

  # ── JOB 8: BUILD + TRIVY ──────────────────────────────────────────────────
  build:
    name: 🐳 Build + Escaneo de imágenes (Trivy)
    runs-on: ubuntu-latest
    # pact sigue comentado — agregarlo a needs cuando esté listo.
    needs: [lint, jest]
    steps:
      - uses: actions/checkout@v7

      - name: Construir imagen API (NestJS)
        run: |
          docker build \
            -t ${{ env.IMAGE_API }}:${{ env.TAG }} \
            -t ${{ env.IMAGE_API }}:latest \
            --build-arg GIT_SHA=${{ env.TAG }} \
            -f apps/backend/Dockerfile \
            .

      - name: Construir imagen Web (Next.js)
        run: |
          docker build \
            -t ${{ env.IMAGE_WEB }}:${{ env.TAG }} \
            -t ${{ env.IMAGE_WEB }}:latest \
            --build-arg NEXT_PUBLIC_API_URL=https://bistrolink-api-staging.up.railway.app \
            --build-arg NEXT_PUBLIC_WS_URL=wss://bistrolink-api-staging.up.railway.app \
            --build-arg NEXT_PUBLIC_KEYCLOAK_URL=https://bistrolink-auth-staging.up.railway.app \
            --build-arg NEXT_PUBLIC_KEYCLOAK_REALM=bistrolink \
            --build-arg NEXT_PUBLIC_KEYCLOAK_CLIENT_ID=bistrolink-frontend \
            --build-arg NEXT_PUBLIC_APP_VERSION=${{ env.TAG }} \
            -f apps/frontend/Dockerfile \
            .

      - name: Construir imagen Keycloak (con realm incluido)
        run: |
          docker build \
            -t ${{ env.IMAGE_AUTH }}:${{ env.TAG }} \
            -t ${{ env.IMAGE_AUTH }}:latest \
            -f keycloak/Dockerfile.auth \
            .

      - name: Trivy — escaneo imagen API
        # @master -> @0.35.0: fijar a una versión concreta. En marzo de 2026 se
        # reescribieron 75 de 76 tags de este repo con un payload malicioso que
        # robaba secrets del pipeline; @master queda expuesto a que el próximo
        # push del mantenedor se ejecute acá sin revisión de nadie del equipo.
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.IMAGE_API }}:${{ env.TAG }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          trivyignores: .trivyignore

      - name: Trivy — escaneo imagen Web
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.IMAGE_WEB }}:${{ env.TAG }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          trivyignores: .trivyignore

      - name: Trivy — escaneo imagen Keycloak
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.IMAGE_AUTH }}:${{ env.TAG }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          trivyignores: .trivyignore

      - name: Publicar imágenes en GHCR
        if: github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/')
        run: |
          echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ${{ env.IMAGE_API }}:${{ env.TAG }}
          docker push ${{ env.IMAGE_WEB }}:${{ env.TAG }}
          docker push ${{ env.IMAGE_AUTH }}:${{ env.TAG }}
          docker push ${{ env.IMAGE_API }}:latest        
          docker push ${{ env.IMAGE_WEB }}:latest        
          docker push ${{ env.IMAGE_AUTH }}:latest
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
            docker tag ${{ env.IMAGE_API }}:${{ env.TAG }} ${{ env.IMAGE_API }}:${VERSION}
            docker tag ${{ env.IMAGE_WEB }}:${{ env.TAG }} ${{ env.IMAGE_WEB }}:${VERSION}
            docker tag ${{ env.IMAGE_AUTH }}:${{ env.TAG }} ${{ env.IMAGE_AUTH }}:${VERSION}
            docker push ${{ env.IMAGE_API }}:${VERSION}
            docker push ${{ env.IMAGE_WEB }}:${VERSION}
            docker push ${{ env.IMAGE_AUTH }}:${VERSION}
          fi

  # ── JOB 9: DEPLOY STAGING ─────────────────────────────────────────────────
  deploy-staging:
    name: 🚀 Deploy staging (Railway)
    needs: [gitleaks, codeql, sonarcloud, snyk, build, changes]
    if: |
      github.ref == 'refs/heads/develop' &&
      (
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.apps == 'true'
      )
    runs-on: ubuntu-latest
    env:
      RAILWAY_GRAPHQL: https://backboard.railway.com/graphql/v2
      ENVIRONMENT_ID: bfeb236f-2012-4a5e-a681-5c4728e6830a
      API_SERVICE_ID: 45dc82be-fd53-4b80-ba9c-384bbbdba034
      WEB_SERVICE_ID: 070e5864-c5af-47e3-89d4-89c3041bc98b
      AUTH_SERVICE_ID: dd1b662a-4bcb-450c-a57e-fa0fe6fb5773
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependencias (solo backend, para prisma migrate)
        # npm pkg delete scripts.prepare: sin esto, "npm ci" dispara el
        # script "prepare" (husky) del package.json raíz, y falla con
        # "husky: not found" porque --workspace no instala esa devDependency
        # de la raíz. Mismo ajuste que ya usan los Dockerfiles de API/Web.
        run: npm pkg delete scripts.prepare && npm ci --workspace=apps/backend

      # NOTA (hallazgo BL-137): la base de staging quedó sin ninguna tabla
      # por un buen tiempo sin que nadie lo notara — el pipeline nunca
      # aplicaba migraciones ahí, solo contra la base efímera del job de
      # tests. Este paso corre ANTES de los deploys de servicios para que el
      # código nuevo siempre arranque contra un esquema ya al día. No corre
      # el seed (son datos de prueba, no forman parte de un deploy real).
      - name: Aplicar migraciones de Prisma en staging
        working-directory: apps/backend
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: npx prisma migrate deploy

      # NOTA: ya NO usamos "railway redeploy" — ese comando solo vuelve a
      # desplegar el commit/imagen que el servicio ya tenía configurado, no
      # fuerza un pull nuevo del tag actualizado. Por eso el servicio se
      # quedaba corriendo la imagen vieja aunque GHCR ya tuviera una nueva.
      # En su lugar: serviceInstanceUpdate (cambia el tag de imagen) +
      # serviceInstanceDeployV2 (dispara el deploy con ese tag ya seteado).
      - name: Actualizar y deployar API (tag por SHA)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          IMAGE="${{ env.IMAGE_API }}:${{ env.TAG }}"

          curl -sSf -X POST "$RAILWAY_GRAPHQL" \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg s "$API_SERVICE_ID" --arg e "$ENVIRONMENT_ID" --arg img "$IMAGE" '{
              query: "mutation($serviceId: String!, $environmentId: String!, $input: ServiceInstanceUpdateInput!) { serviceInstanceUpdate(serviceId: $serviceId, environmentId: $environmentId, input: $input) }",
              variables: { serviceId: $s, environmentId: $e, input: { source: { image: $img } } }
            }')"

          curl -sSf -X POST "$RAILWAY_GRAPHQL" \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg s "$API_SERVICE_ID" --arg e "$ENVIRONMENT_ID" '{
              query: "mutation($serviceId: String!, $environmentId: String!) { serviceInstanceDeployV2(serviceId: $serviceId, environmentId: $environmentId) }",
              variables: { serviceId: $s, environmentId: $e }
            }')"

      - name: Actualizar y deployar Web (tag por SHA)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          IMAGE="${{ env.IMAGE_WEB }}:${{ env.TAG }}"

          curl -sSf -X POST "$RAILWAY_GRAPHQL" \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg s "$WEB_SERVICE_ID" --arg e "$ENVIRONMENT_ID" --arg img "$IMAGE" '{
              query: "mutation($serviceId: String!, $environmentId: String!, $input: ServiceInstanceUpdateInput!) { serviceInstanceUpdate(serviceId: $serviceId, environmentId: $environmentId, input: $input) }",
              variables: { serviceId: $s, environmentId: $e, input: { source: { image: $img } } }
            }')"

          curl -sSf -X POST "$RAILWAY_GRAPHQL" \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg s "$WEB_SERVICE_ID" --arg e "$ENVIRONMENT_ID" '{
              query: "mutation($serviceId: String!, $environmentId: String!) { serviceInstanceDeployV2(serviceId: $serviceId, environmentId: $environmentId) }",
              variables: { serviceId: $s, environmentId: $e }
            }')"

      - name: Actualizar y deployar Keycloak (tag por SHA)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          IMAGE="${{ env.IMAGE_AUTH }}:${{ env.TAG }}"

          curl -sSf -X POST "$RAILWAY_GRAPHQL" \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg s "$AUTH_SERVICE_ID" --arg e "$ENVIRONMENT_ID" --arg img "$IMAGE" '{
              query: "mutation($serviceId: String!, $environmentId: String!, $input: ServiceInstanceUpdateInput!) { serviceInstanceUpdate(serviceId: $serviceId, environmentId: $environmentId, input: $input) }",
              variables: { serviceId: $s, environmentId: $e, input: { source: { image: $img } } }
            }')"

          curl -sSf -X POST "$RAILWAY_GRAPHQL" \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg s "$AUTH_SERVICE_ID" --arg e "$ENVIRONMENT_ID" '{
              query: "mutation($serviceId: String!, $environmentId: String!) { serviceInstanceDeployV2(serviceId: $serviceId, environmentId: $environmentId) }",
              variables: { serviceId: $s, environmentId: $e }
            }')"

      - name: Health check staging
        run: |
          sleep 40
          curl -f https://bistrolink-api-staging.up.railway.app/health

